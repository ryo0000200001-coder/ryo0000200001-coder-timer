<title>ひとつタイマー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one quiet column, giant tabular digits, a thin progress line, controls underneath */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --fg: #1B2430;
  --muted: #677485;
  --line: #D5DCE3;
  --accent: #2F67A8;
  --accent-fg: #FFFFFF;
  --done: #C2452D;
  --font-num: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --surface: #1A2029; --fg: #E5EAF0; --muted: #8C98A8;
    --line: #2C3542; --accent: #7EA9DB; --accent-fg: #0E1520; --done: #F07A62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --surface: #1A2029; --fg: #E5EAF0; --muted: #8C98A8;
  --line: #2C3542; --accent: #7EA9DB; --accent-fg: #0E1520; --done: #F07A62;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui);
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.timer { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 28px; }

.display {
  display: flex; align-items: baseline; justify-content: center; gap: 0.05em;
  font-family: var(--font-num); font-weight: 500;
  font-size: clamp(64px, 22vw, 132px); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.display input {
  width: 2.1ch; padding: 0; border: 0; background: transparent; color: inherit;
  font: inherit; letter-spacing: inherit; text-align: center;
  border-bottom: 2px dashed var(--line); border-radius: 0;
  -moz-appearance: textfield;
}
.display input::-webkit-inner-spin-button, .display input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.display input:focus { outline: none; border-bottom-color: var(--accent); }
.display input:disabled { border-bottom-color: transparent; opacity: 1; -webkit-text-fill-color: var(--fg); }
.colon { color: var(--muted); }
.timer.finished .display, .timer.finished .display input:disabled { color: var(--done); -webkit-text-fill-color: var(--done); }
.timer.finished .display { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { opacity: .35; } }

.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
.timer.finished .bar span { background: var(--done); }

.status { text-align: center; color: var(--muted); font-size: 14px; min-height: 1.4em; margin-top: -14px; }

.presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  font: inherit; font-size: 14px; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 14px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; border-color: var(--line); }

.controls { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn {
  font: inherit; font-size: 17px; font-weight: 700;
  padding: 16px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) { .timer.finished .display { animation: none; } }
</style>

<main class="timer" id="timer">
  <div class="display" aria-label="残り時間">
    <input id="min" type="number" inputmode="numeric" min="0" max="99" value="05" aria-label="分">
    <span class="colon">:</span>
    <input id="sec" type="number" inputmode="numeric" min="0" max="59" value="00" aria-label="秒">
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="status" id="status">数字をタップして時間を変更できます</div>

  <div class="presets" id="presets">
    <button class="chip" data-s="60">1分</button>
    <button class="chip" data-s="180">3分</button>
    <button class="chip" data-s="300">5分</button>
    <button class="chip" data-s="600">10分</button>
    <button class="chip" data-s="1500">25分</button>
    <button class="chip" data-add="60">＋1分</button>
  </div>

  <div class="controls">
    <button class="btn" id="reset">リセット</button>
    <button class="btn primary" id="toggle">スタート</button>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const root = $("timer"), minEl = $("min"), secEl = $("sec"), bar = $("bar"),
        statusEl = $("status"), toggleBtn = $("toggle"), resetBtn = $("reset");

  let total = 300;        // 設定した秒数
  let remaining = 300;    // 残り（ミリ秒ではなく秒、小数あり）
  let endAt = 0, raf = 0, running = false, beepTimer = 0, audio = null;

  const pad = n => String(n).padStart(2, "0");

  function render() {
    const s = Math.ceil(remaining);
    minEl.value = pad(Math.floor(s / 60));
    secEl.value = pad(s % 60);
    bar.style.transform = `scaleX(${total ? remaining / total : 0})`;
    document.title = running ? `${pad(Math.floor(s / 60))}:${pad(s % 60)} ・ ひとつタイマー` : "ひとつタイマー";
  }

  function readInputs() {
    const m = Math.min(99, Math.max(0, parseInt(minEl.value, 10) || 0));
    const s = Math.min(59, Math.max(0, parseInt(secEl.value, 10) || 0));
    total = remaining = m * 60 + s;
    render();
  }

  function setLocked(locked) {
    minEl.disabled = secEl.disabled = locked;
    document.querySelectorAll("#presets .chip").forEach(b => {
      b.disabled = locked && !b.dataset.add;
    });
  }

  function tick() {
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    render();
    if (remaining <= 0) return finish();
    raf = requestAnimationFrame(tick);
  }

  function start() {
    readIfIdle();
    if (remaining <= 0) { statusEl.textContent = "時間を設定してください"; return; }
    ensureAudio();
    stopAlarm();
    running = true;
    endAt = Date.now() + remaining * 1000;
    root.classList.remove("finished");
    toggleBtn.textContent = "一時停止";
    statusEl.textContent = "カウント中";
    setLocked(true);
    tick();
  }

  function readIfIdle() {
    if (!running && remaining === total) readInputs();
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    toggleBtn.textContent = "再開";
    statusEl.textContent = "一時停止中";
    render();
  }

  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    stopAlarm();
    root.classList.remove("finished");
    remaining = total;
    toggleBtn.textContent = "スタート";
    statusEl.textContent = "数字をタップして時間を変更できます";
    setLocked(false);
    render();
  }

  function finish() {
    running = false;
    root.classList.add("finished");
    toggleBtn.textContent = "もう一度";
    statusEl.textContent = "時間です";
    document.title = "⏰ 時間です";
    setLocked(false);
    remaining = 0;
    playAlarm();
  }

  // --- 音 ---
  function ensureAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }
  function beep(t, freq) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 0.2);
  }
  function playAlarm() {
    if (!audio) return;
    let count = 0;
    const ring = () => {
      const t = audio.currentTime;
      [0, 0.25, 0.5].forEach(d => beep(t + d, 880));
      if (++count >= 8) stopAlarm();
    };
    ring();
    beepTimer = setInterval(ring, 1200);
  }
  function stopAlarm() { clearInterval(beepTimer); beepTimer = 0; }

  // --- イベント ---
  toggleBtn.addEventListener("click", () => {
    if (running) return pause();
    if (root.classList.contains("finished")) { reset(); }
    start();
  });
  resetBtn.addEventListener("click", reset);

  [minEl, secEl].forEach(el => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("change", () => { stopAlarm(); root.classList.remove("finished"); readInputs(); toggleBtn.textContent = "スタート"; });
    el.addEventListener("keydown", e => { if (e.key === "Enter") { el.blur(); start(); } });
  });

  $("presets").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b || b.disabled) return;
    if (b.dataset.add) {
      const add = +b.dataset.add;
      if (running) { endAt += add * 1000; total += add; remaining += add; }
      else { readIfIdle(); total = remaining + add; remaining = total; }
      if (!running) { stopAlarm(); root.classList.remove("finished"); toggleBtn.textContent = remaining === total ? "スタート" : toggleBtn.textContent; }
      render();
      return;
    }
    reset();
    total = remaining = +b.dataset.s;
    render();
  });

  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
      e.preventDefault(); toggleBtn.click();
    }
  });

  render();
})();
</script>
